<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Solapur outstation trip with Mirantar">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14315A"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a3a"/>
      <stop offset="1" stop-color="#0d1820"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="120" cy="60" r="2" fill="#EFD096" opacity="0.7"/>
  <circle cx="340" cy="40" r="1.5" fill="#EFD096" opacity="0.6"/>
  <circle cx="600" cy="55" r="2" fill="#EFD096" opacity="0.8"/>
  <circle cx="850" cy="45" r="1.5" fill="#EFD096" opacity="0.7"/>
  <circle cx="1080" cy="65" r="2" fill="#EFD096" opacity="0.6"/>
  <!-- Solapur fort / Bhuikot fort outline -->
  <!-- Fort wall left -->
  <rect x="250" y="280" width="15" height="120" fill="#5A4020" opacity="0.85"/>
  <rect x="235" y="270" width="45" height="18" fill="#6A5028" opacity="0.85"/>
  <!-- Bastion left -->
  <ellipse cx="257" cy="275" rx="28" ry="25" fill="#5A4020" opacity="0.8"/>
  <!-- Fort wall centre -->
  <rect x="265" y="300" width="670" height="100" fill="#4A3010" opacity="0.8"/>
  <!-- Merlons on fort wall -->
  <rect x="270" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="300" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="330" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="360" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="560" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="590" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="620" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="860" y="287" width="20" height="15" fill="#5A4020"/>
  <rect x="890" y="287" width="20" height="15" fill="#5A4020"/>
  <!-- Fort gate arch -->
  <rect x="565" y="300" width="70" height="100" fill="#3A2008"/>
  <path d="M565,320 Q600,295 635,320" fill="#3A2008"/>
  <!-- Bastion right -->
  <ellipse cx="943" cy="275" rx="28" ry="25" fill="#5A4020" opacity="0.8"/>
  <rect x="915" y="270" width="56" height="18" fill="#6A5028" opacity="0.85"/>
  <rect x="935" y="280" width="15" height="120" fill="#5A4020" opacity="0.85"/>
  <!-- Road / highway suggesting outstation journey -->
  <path d="M400 560 L600 420 L800 560" fill="none" stroke="#C8892A" stroke-width="3" opacity="0.4"/>
  <!-- Ertiga silhouette on road -->
  <rect x="550" y="498" width="100" height="38" rx="8" fill="#14315A" opacity="0.9"/>
  <rect x="562" y="488" width="68" height="18" rx="5" fill="#1d4a7a" opacity="0.85"/>
  <circle cx="568" cy="536" r="9" fill="#222" opacity="0.9"/>
  <circle cx="632" cy="536" r="9" fill="#222" opacity="0.9"/>
  <rect x="556" y="503" width="22" height="14" rx="2" fill="#D99A2B" opacity="0.7"/>
  <rect x="622" y="503" width="22" height="14" rx="2" fill="#D99A2B" opacity="0.4"/>
  <!-- Ground -->
  <path d="M0 560 L200 520 L500 545 L700 510 L1000 535 L1200 515 L1200 800 L0 800 Z" fill="#071527" opacity="0.95"/>
  <rect x="100" y="700" width="1000" height="2" fill="#D99A2B" opacity="0.5"/>
  <!-- Text -->
  <text x="600" y="635" text-anchor="middle" font-family="Georgia,serif" font-size="48" font-weight="bold" letter-spacing="5" fill="#FFFFFF">SOLAPUR</text>
  <text x="600" y="675" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" letter-spacing="2" fill="#EFD096">Private Ertiga Outstation · with Mirantar</text>
</svg>
