<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Tuljapur — Tulja Bhavani Temple with Mirantar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0a2e"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1b5e"/>
      <stop offset="0.6" stop-color="#14315A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="150" cy="80" r="2" fill="#EFD096" opacity="0.8"/>
  <circle cx="300" cy="50" r="1.5" fill="#EFD096" opacity="0.6"/>
  <circle cx="500" cy="90" r="2" fill="#EFD096" opacity="0.7"/>
  <circle cx="720" cy="60" r="1.5" fill="#EFD096" opacity="0.8"/>
  <circle cx="950" cy="75" r="2" fill="#EFD096" opacity="0.6"/>
  <circle cx="1100" cy="40" r="1.5" fill="#EFD096" opacity="0.7"/>
  <!-- Temple silhouette - Tuljapur style Hemadpanthi temple -->
  <!-- Main shikhara -->
  <polygon points="580,120 600,80 620,120" fill="#D99A2B" opacity="0.95"/>
  <rect x="560" y="120" width="80" height="15" fill="#D99A2B" opacity="0.9"/>
  <polygon points="548,135 600,100 652,135" fill="#D99A2B" opacity="0.85"/>
  <rect x="540" y="135" width="120" height="15" fill="#C8892A" opacity="0.9"/>
  <polygon points="525,150 600,120 675,150" fill="#D99A2B" opacity="0.8"/>
  <rect x="515" y="150" width="170" height="20" fill="#B87A24" opacity="0.9"/>
  <!-- Temple body -->
  <rect x="530" y="170" width="140" height="100" fill="#8B6914" opacity="0.9"/>
  <!-- Mandap columns -->
  <rect x="480" y="210" width="18" height="60" fill="#7A5C10" opacity="0.9"/>
  <rect x="510" y="210" width="18" height="60" fill="#7A5C10" opacity="0.9"/>
  <rect x="672" y="210" width="18" height="60" fill="#7A5C10" opacity="0.9"/>
  <rect x="702" y="210" width="18" height="60" fill="#7A5C10" opacity="0.9"/>
  <rect x="478" y="207" width="246" height="10" fill="#C8892A" opacity="0.85"/>
  <!-- Temple base -->
  <rect x="460" y="270" width="280" height="20" fill="#6B4F10" opacity="0.95"/>
  <!-- Steps -->
  <rect x="450" y="290" width="300" height="12" fill="#5A3E0C" opacity="0.9"/>
  <rect x="440" y="302" width="320" height="12" fill="#4A3008" opacity="0.9"/>
  <!-- Deepmala / lamp post -->
  <rect x="415" y="220" width="8" height="80" fill="#C8892A" opacity="0.9"/>
  <polygon points="411,215 419,215 415,200" fill="#D99A2B"/>
  <rect x="765" y="220" width="8" height="80" fill="#C8892A" opacity="0.9"/>
  <polygon points="761,215 769,215 765,200" fill="#D99A2B"/>
  <!-- Ground / hilltop -->
  <path d="M0 560 L200 440 L350 490 L500 400 L600 380 L700 410 L850 460 L1000 430 L1200 500 L1200 800 L0 800 Z" fill="#071527" opacity="0.9"/>
  <!-- Orange glow behind temple -->
  <ellipse cx="600" cy="370" rx="200" ry="60" fill="#D99A2B" opacity="0.08"/>
  <!-- Turmeric-yellow accent ground line -->
  <rect x="100" y="700" width="1000" height="2" fill="#D99A2B" opacity="0.5"/>
  <!-- Text -->
  <text x="600" y="640" text-anchor="middle" font-family="Georgia,serif" font-size="48" font-weight="bold" letter-spacing="5" fill="#FFFFFF">TULJAPUR</text>
  <text x="600" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" letter-spacing="2" fill="#EFD096">Tulja Bhavani Temple · with Mirantar</text>
</svg>
